---
# 1. NAMESPACE DEDICADO
apiVersion: v1
kind: Namespace
metadata:
  name: urbanpulse

---
# 2. DEPLOYMENT (Onde corre o teu contentor)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-deploy
  namespace: urbanpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      imagePullSecrets:             # <-- ADICIONA ISTO
      - name: dockerhub-secret
      containers:
      - name: payment-service
        # MUDA ISTO para o teu username do Docker Hub!
        image: pedrorosa3/payment-service:v5 
        ports:
        - containerPort: 8006
        
        # GESTÃO DE RECURSOS (Exigência da Fase 5)
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
            
        # LIVENESS PROBE (Para o K8s saber se a API encravou)
        livenessProbe:
          httpGet:
            path: /docs
            port: 8006
          initialDelaySeconds: 15
          periodSeconds: 20

---
# 3. SERVICE (Comunicação Interna)
apiVersion: v1
kind: Service
metadata:
  name: payment-svc
  namespace: urbanpulse
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - protocol: TCP
      port: 8006
      targetPort: 8006

---
# 4. HPA - AUTOSCALING (Exigência da Fase 5)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-hpa
  namespace: urbanpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-deploy
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
# 5. INGRESS (Para expor a API à Internet)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-ingress
  namespace: urbanpulse
spec:
  defaultBackend:
    service:
      name: payment-svc
      port:
        number: 8006
