apiVersion: apps/v1
kind: Deployment
metadata:
  name: location-api
  namespace: urbanpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: location-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: location-api
    spec:
      containers:
        - name: location-api
          image: europe-west1-docker.pkg.dev/fc60250/urbanpulse/location-api:latest
          imagePullPolicy: Always
          env:
            - name: DB_HOST
              value: "location-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "location_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: location-db-secrets
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: location-db-secrets
                  key: password
            - name: DEMAND_SERVICE_URL
              value: "demand-api:50053"
          ports:
            - containerPort: 8000
              name: rest
            - containerPort: 50054
              name: grpc
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /locations/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /locations/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
