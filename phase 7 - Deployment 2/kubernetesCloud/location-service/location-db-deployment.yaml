apiVersion: apps/v1
kind: Deployment
metadata:
  name: location-db
  namespace: urbanpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: location-db
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: location-db
    spec:
      containers:
        - name: location-db
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_PASSWORD
              value: "isqueiro20"
            - name: POSTGRES_DB
              value: "location_db"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: location-db-storage
              mountPath: /var/lib/postgresql/data
            - name: location-db-init
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "admin", "-d", "location_db"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "admin", "-d", "location_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: location-db-storage
          persistentVolumeClaim:
            claimName: location-db-pvc
        - name: location-db-init
          configMap:
            name: location-db-init
