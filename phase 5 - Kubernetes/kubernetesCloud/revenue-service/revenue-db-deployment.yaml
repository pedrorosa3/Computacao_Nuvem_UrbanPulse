apiVersion: apps/v1
kind: Deployment
metadata:
  name: revenue-db
  namespace: urbanpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: revenue-db
  template:
    metadata:
      labels:
        app: revenue-db
    spec:
      containers:
        - name: revenue-db
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: "urbanpulse"
            - name: POSTGRES_PASSWORD
              value: "urbanpulse"
            - name: POSTGRES_DB
              value: "revenue_db"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: revenue-db-storage
              mountPath: /var/lib/postgresql/data
            - name: revenue-db-init
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "urbanpulse", "-d", "revenue_db"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "urbanpulse", "-d", "revenue_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: revenue-db-storage
          persistentVolumeClaim:
            claimName: revenue-db-pvc
        - name: revenue-db-init
          configMap:
            name: revenue-db-init