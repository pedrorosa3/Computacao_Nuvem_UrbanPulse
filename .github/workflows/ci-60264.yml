name: CI — Trip Service (60264)

on:
  push:
    branches:
      - 60264
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Lint Trip Service — critical errors
        working-directory: "phase 8 - Automation/MicroServices/trip-service"
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint Trip Service — style warnings
        working-directory: "phase 8 - Automation/MicroServices/trip-service"
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Trip Service dependencies
        working-directory: "phase 8 - Automation/MicroServices/trip-service"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Test Trip Service
        working-directory: "phase 8 - Automation/MicroServices/trip-service"
        run: pytest tests.py --junitxml=junit/test-results-trip.xml --cov=app --cov-report=xml --cov-report=html

  pr-test:
    name: Pull Request Tests
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Trip Service dependencies
        working-directory: "phase 8 - Automation/MicroServices/trip-service"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Pull Request Tests — Trip Service
        working-directory: "phase 8 - Automation/MicroServices/trip-service"
        run: pytest tests_pr.py --junitxml=junit/test-results-trip-staging.xml --cov=app --cov-report=xml --cov-report=html

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary pandas sqlalchemy python-dotenv

      - name: Copy test CSVs to home directory
        run: |
          cp "phase 8 - Automation/test-data/test_trips.csv" ~/yellow_tripdata_2015-01_clean.csv
          cp "phase 8 - Automation/test-data/taxi_zone_lookup.csv" ~/taxi_zone_lookup.csv

      - name: Create .env from example (BDs de teste efémeras)
        working-directory: "phase 8 - Automation"
        run: cp .env.example .env

      - name: Start all services
        working-directory: "phase 8 - Automation"
        run: docker compose -f docker-compose-test.yml up -d --build

      - name: Wait for databases to be ready
        run: sleep 60

      - name: Seed all databases
        run: |
          (cd "phase 8 - Automation/MicroServices/location-service" && python3 seed.py)
          (cd "phase 8 - Automation/MicroServices/demand-service" && python3 seed.py)
          (cd "phase 8 - Automation/MicroServices/revenue-service" && python3 seed.py)
          (cd "phase 8 - Automation/MicroServices/trip-service" && python3 seed.py)
          (cd "phase 8 - Automation/MicroServices/payment-service" && python3 seed.py)

      - name: Run integration tests
        working-directory: "phase 8 - Automation"
        run: pytest tests_integration/test_trip_integration.py -v

      - name: Stop all services
        if: always()
        working-directory: "phase 8 - Automation"
        run: docker compose -f docker-compose-test.yml down
