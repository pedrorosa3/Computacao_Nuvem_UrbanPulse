name: CI — Payment Service (60294)

on:
  push:
    branches:
      - 60294
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JUST_APPLICATION_ACTIONS_TO_NODE24: true

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Lint Payment Service — critical errors
        working-directory: "phase 8 - Automation/MicroServices/payment-service"
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint Payment Service — style warnings
        working-directory: "phase 8 - Automation/MicroServices/payment-service"
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Payment Service dependencies
        working-directory: "phase 8 - Automation/MicroServices/payment-service"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Test Payment Service
        working-directory: "phase 8 - Automation/MicroServices/payment-service"
        run: pytest tests.py --junitxml=junit/test-results-payment.xml --cov=app --cov-report=xml --cov-report=html

  pr-test:
    name: Pull Request Tests
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Payment Service dependencies
        working-directory: "phase 8 - Automation/MicroServices/payment-service"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Pull Request Tests — Payment Service
        working-directory: "phase 8 - Automation/MicroServices/payment-service"
        run: pytest tests_pr.py --junitxml=junit/test-results-payment-staging.xml --cov=app --cov-report=xml --cov-report=html

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary pandas sqlalchemy python-dotenv

      - name: Copy test CSVs to home directory
        run: |
          cp "phase 8 - Automation/test-data/test_trips.csv" ~/yellow_tripdata_2015-01_clean.csv
          cp "phase 8 - Automation/test-data/taxi_zone_lookup.csv" ~/taxi_zone_lookup.csv

      - name: Create .env from example (BDs de teste efémeras)
        working-directory: "phase 8 - Automation"
        run: cp .env.example .env

      - name: Start all services
        working-directory: "phase 8 - Automation"
        run: docker compose -f docker-compose-test.yml up -d --build

      - name: Wait for databases to be ready
        run: sleep 60

      - name: Seed all databases
        run: |
          (cd "phase 8 - Automation/MicroServices/location-service" && python3 seed.py)
          (cd "phase 8 - Automation/MicroServices/demand-service" && python3 seed.py)
          (cd "phase 8 - Automation/MicroServices/revenue-service" && python3 seed.py)
          (cd "phase 8 - Automation/MicroServices/trip-service" && python3 seed.py)
          (cd "phase 8 - Automation/MicroServices/payment-service" && python3 seed.py)

      - name: Run integration tests
        working-directory: "phase 8 - Automation"
        run: pytest tests_integration/test_payment_integration.py -v

      - name: Stop all services
        if: always()
        working-directory: "phase 8 - Automation"
        run: docker compose -f docker-compose-test.yml down

  build-push:
    name: Build & Push Images (Artifact Registry 60294)
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      REGISTRY: europe-west1-docker.pkg.dev/computacaonuvem60294/urbanpulse
      HAS_GCP_KEY: ${{ secrets.GCP_SA_KEY_60294 != '' }}
    steps:
      - name: Check GCP credentials
        if: env.HAS_GCP_KEY != 'true'
        run: echo "::warning title=CD saltado::O secret GCP_SA_KEY_60294 não está configurado neste repositório. As imagens não foram publicadas no Artifact Registry."

      - uses: actions/checkout@v5
        if: env.HAS_GCP_KEY == 'true'

      - name: Authenticate to GCP
        if: env.HAS_GCP_KEY == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_60294 }}

      - name: Set up Cloud SDK
        if: env.HAS_GCP_KEY == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: env.HAS_GCP_KEY == 'true'
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build & Push das 6 imagens
        if: env.HAS_GCP_KEY == 'true'
        working-directory: "phase 8 - Automation/MicroServices"
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          for pair in \
            location-service:location-api \
            analytics-service:analytics-api \
            demand-service:demand-api \
            revenue-service:revenue-api \
            trip-service:trip-api \
            payment-service:payment-service; do
            dir="${pair%%:*}"; img="${pair##*:}"
            echo "::group::$img"
            docker build -t "$REGISTRY/$img:latest" -t "$REGISTRY/$img:$SHORT_SHA" "$dir"
            docker push --all-tags "$REGISTRY/$img"
            echo "::endgroup::"
          done
