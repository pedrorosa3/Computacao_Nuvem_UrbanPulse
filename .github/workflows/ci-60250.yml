name: CI — Location & Analytics Services (60250)

on:
  push:
    branches:
      - 60250
      - main
  pull_request:
    branches:
      - main

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Lint Location Service — critical errors
        working-directory: "phase 8 - Automation/MicroServices/location-service"
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint Location Service — style warnings
        working-directory: "phase 8 - Automation/MicroServices/location-service"
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Lint Analytics Service — critical errors
        working-directory: "phase 8 - Automation/MicroServices/analytics-service"
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint Analytics Service — style warnings
        working-directory: "phase 8 - Automation/MicroServices/analytics-service"
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Location Service dependencies
        working-directory: "phase 8 - Automation/MicroServices/location-service"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Test Location Service
        working-directory: "phase 8 - Automation/MicroServices/location-service"
        run: pytest tests.py --junitxml=junit/test-results-location.xml --cov=app --cov-report=xml --cov-report=html

      - name: Install Analytics Service dependencies
        working-directory: "phase 8 - Automation/MicroServices/analytics-service"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Test Analytics Service
        working-directory: "phase 8 - Automation/MicroServices/analytics-service"
        run: pytest tests.py --junitxml=junit/test-results-analytics.xml --cov=app --cov-report=xml --cov-report=html

  staging-test:
    name: Staging Tests
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Location Service dependencies
        working-directory: "phase 8 - Automation/MicroServices/location-service"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Staging Tests — Location Service
        working-directory: "phase 8 - Automation/MicroServices/location-service"
        run: pytest tests_staging.py --junitxml=junit/test-results-location-staging.xml --cov=app --cov-report=xml --cov-report=html

      - name: Install Analytics Service dependencies
        working-directory: "phase 8 - Automation/MicroServices/analytics-service"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Staging Tests — Analytics Service
        working-directory: "phase 8 - Automation/MicroServices/analytics-service"
        run: pytest tests_staging.py --junitxml=junit/test-results-analytics-staging.xml --cov=app --cov-report=xml --cov-report=html

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary pandas sqlalchemy

      - name: Copy test CSVs to home directory
        run: |
          cp "phase 8 - Automation/test-data/test_trips.csv" ~/yellow_tripdata_2015-01_clean.csv
          cp "phase 8 - Automation/test-data/taxi_zone_lookup.csv" ~/taxi_zone_lookup.csv

      - name: Start all services
        working-directory: "phase 8 - Automation"
        run: docker compose -f docker-compose-test.yml up -d --build

      - name: Wait for databases to be ready
        run: sleep 60

      - name: Seed all databases
        run: |
          (cd "phase 8 - Automation/MicroServices/location-service" && python3 seed.py)
          (cd "phase 8 - Automation/MicroServices/demand-service" && python3 seed.py)
          (cd "phase 8 - Automation/MicroServices/revenue-service" && python3 seed.py)
          (cd "phase 8 - Automation/MicroServices/trip-service" && python3 seed.py)
          (cd "phase 8 - Automation/MicroServices/payment-service" && python3 seed.py)

      - name: Run integration tests
        working-directory: "phase 8 - Automation"
        run: pytest tests_integration/ -v

      - name: Stop all services
        if: always()
        working-directory: "phase 8 - Automation"
        run: docker compose -f docker-compose-test.yml down
