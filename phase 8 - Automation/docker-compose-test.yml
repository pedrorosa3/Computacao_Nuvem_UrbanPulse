services:

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PostgreSQL — Location ─────────────────────────────────────────────────────
  location-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: isqueiro20
      POSTGRES_DB: location_db
    volumes:
      - ./MicroServices/location-service/db:/docker-entrypoint-initdb.d
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d location_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── PostgreSQL — Demand ───────────────────────────────────────────────────────
  demand-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urbanpulse
      POSTGRES_PASSWORD: urbanpulse
      POSTGRES_DB: demand_db
    volumes:
      - ./MicroServices/demand-service/db:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanpulse -d demand_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── PostgreSQL — Payment ──────────────────────────────────────────────────────
  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payment_db
    volumes:
      - ./MicroServices/payment-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── PostgreSQL — Trip ─────────────────────────────────────────────────────────
  trip-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: isqueiro20
      POSTGRES_DB: trip_db
    volumes:
      - ./MicroServices/trip-service/db:/docker-entrypoint-initdb.d
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d trip_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── PostgreSQL — Revenue ──────────────────────────────────────────────────────
  revenue-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urbanpulse
      POSTGRES_PASSWORD: urbanpulse
      POSTGRES_DB: revenue_db
    volumes:
      - ./MicroServices/revenue-service/db:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanpulse -d revenue_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Location Service ──────────────────────────────────────────────────────────
  location-api:
    build:
      context: ./MicroServices/location-service
    environment:
      DB_HOST: location-db
      DB_PORT: 5432
      DB_NAME: location_db
      DB_USER: admin
      DB_PASSWORD: isqueiro20
      DEMAND_SERVICE_URL: demand-api:50053
    ports:
      - "8000:8000"
      - "50054:50054"
    depends_on:
      location-db:
        condition: service_healthy
      demand-api:
        condition: service_started

  # ── Demand Service ────────────────────────────────────────────────────────────
  demand-api:
    build:
      context: ./MicroServices/demand-service
    environment:
      DATABASE_URL: postgresql://urbanpulse:urbanpulse@demand-db:5432/demand_db
      LOCATION_SERVICE_URL: location-api:50054
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: "300"
    ports:
      - "8002:8002"
      - "50053:50053"
    depends_on:
      demand-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Trip Service ──────────────────────────────────────────────────────────────
  trip-api:
    build:
      context: ./MicroServices/trip-service
    environment:
      DB_HOST: trip-db
      DB_PORT: 5432
      DB_NAME: trip_db
      DB_USER: admin
      DB_PASSWORD: isqueiro20
    ports:
      - "8001:8001"
      - "50051:50051"
    depends_on:
      trip-db:
        condition: service_healthy

  # ── Payment Service ───────────────────────────────────────────────────────────
  payment-api:
    build:
      context: ./MicroServices/payment-service
    environment:
      DB_HOST: payment-db
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USER: admin
      DB_PASSWORD: password
      DATABASE_URL: postgresql://admin:password@payment-db:5432/payment_db
      TRIP_SERVICE_URL: trip-api:50051
    ports:
      - "8006:8006"
      - "50052:50052"
    depends_on:
      payment-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      trip-api:
        condition: service_started

  # ── Revenue Service ───────────────────────────────────────────────────────────
  revenue-api:
    build:
      context: ./MicroServices/revenue-service
    environment:
      DATABASE_URL: postgresql://urbanpulse:urbanpulse@revenue-db:5432/revenue_db
      TRIP_SERVICE_URL: trip-api:50051
      LOCATION_SERVICE_URL: location-api:50054
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: "300"
    ports:
      - "8007:8007"
      - "50055:50055"
    depends_on:
      revenue-db:
        condition: service_healthy
      trip-api:
        condition: service_started

  # ── Analytics Service ─────────────────────────────────────────────────────────
  analytics-api:
    build:
      context: ./MicroServices/analytics-service
    environment:
      LOCATION_SERVICE_URL: location-api:50054
      DEMAND_SERVICE_URL: demand-api:50053
      PAYMENT_SERVICE_URL: payment-api:50052
      TRIP_SERVICE_URL: trip-api:50051
      REVENUE_SERVICE_URL: revenue-api:50055
    ports:
      - "8003:8003"
    depends_on:
      - location-api
      - demand-api
      - trip-api
      - payment-api
      - revenue-api
