apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: location-api-hpa
  namespace: urbanpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: location-api
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
