apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trip-api-hpa
  namespace: urbanpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trip-api
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
