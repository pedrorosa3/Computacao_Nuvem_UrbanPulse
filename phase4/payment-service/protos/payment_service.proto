syntax = "proto3";

package payment;

// O serviço que tu vais disponibilizar aos teus colegas
service PaymentService {
  // Eles enviam-te IDs de viagens, e tu devolves os dados financeiros dessas viagens
  rpc GetPaymentDetails (PaymentRequest) returns (PaymentResponse);
}

// O que os teus colegas te enviam
message PaymentRequest {
  repeated int32 trip_ids = 1;
}

// A estrutura dos dados de uma viagem
message TripPaymentInfo {
  float fare_amount = 1;
  float tip_amount = 2;
  string payment_type = 3;
}

// O que tu devolves (Um dicionário onde a chave é o ID da viagem)
message PaymentResponse {
  map<int32, TripPaymentInfo> payments = 1;
}