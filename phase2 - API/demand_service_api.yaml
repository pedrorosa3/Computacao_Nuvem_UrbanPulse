openapi: 3.0.3
info:
  title: UrbanPulse - Demand Service API
  description: >
    REST API for historical demand analysis of NYC Yellow Taxi trip data.
    Provides temporal and geographic demand patterns for urban mobility analytics.
  version: 1.0.0

paths:

  /demand/hourly-matrix:
    get:
      summary: UC15 - Trip count matrix by hour and day of week
      description: >
        Returns a matrix of trip counts indexed by hour of day (0-23) and day of week
        (0=Monday, 6=Sunday). Peak hours are flagged based on deviation from the
        overall average. By default returns global data across all zones.
        Can be filtered by zone, year and month.
      parameters:
        - name: zone_id
          in: query
          required: false
          description: Filter by pickup zone ID (if omitted, returns global data)
          schema:
            type: integer
            example: 161
        - name: year
          in: query
          required: false
          description: Filter by year (e.g. 2015)
          schema:
            type: integer
            example: 2015
        - name: month
          in: query
          required: false
          description: Filter by month (1-12)
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 6
      responses:
        '200':
          description: Trip count matrix by hour and day of week with peak hour flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters_applied:
                    type: object
                    properties:
                      zone_id:
                        type: integer
                        nullable: true
                        example: 161
                      year:
                        type: integer
                        nullable: true
                        example: 2015
                      month:
                        type: integer
                        nullable: true
                        example: 6
                  overall_avg_trips:
                    type: number
                    format: float
                    description: Overall average trip count across all hours and days
                    example: 1250.5
                  matrix:
                    type: array
                    description: Array of 7 days, each with 24 hourly entries
                    items:
                      type: object
                      properties:
                        day_of_week:
                          type: integer
                          description: 0=Monday, 6=Sunday
                          example: 0
                        day_name:
                          type: string
                          example: "Monday"
                        hours:
                          type: array
                          items:
                            type: object
                            properties:
                              hour:
                                type: integer
                                description: Hour of day (0-23)
                                example: 8
                              trip_count:
                                type: integer
                                description: Number of trips in this hour/day combination
                                example: 3200
                              is_peak:
                                type: boolean
                                description: True if trip count is significantly above overall average
                                example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /demand/monthly-trend:
    get:
      summary: UC16 - Monthly trip volume trend with percentage variation
      description: >
        Returns monthly trip counts over a given period, including the percentage
        change between consecutive months and an overall trend indicator.
        By default returns global data across all zones.
        Can be filtered by zone and year range.
      parameters:
        - name: zone_id
          in: query
          required: false
          description: Filter by pickup zone ID (if omitted, returns global data)
          schema:
            type: integer
            example: 161
        - name: year_from
          in: query
          required: false
          description: Start year of the trend period
          schema:
            type: integer
            example: 2015
        - name: year_to
          in: query
          required: false
          description: End year of the trend period
          schema:
            type: integer
            example: 2016
        - name: compare_by
          in: query
          required: false
          description: >
            Granularity of the variation calculation.
            'month' compares each month to the previous month.
            'year' compares each month to the same month in the previous year.
          schema:
            type: string
            enum: [month, year]
            default: month
      responses:
        '200':
          description: Monthly trip volume trend with variation and trend direction
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters_applied:
                    type: object
                    properties:
                      zone_id:
                        type: integer
                        nullable: true
                        example: 161
                      year_from:
                        type: integer
                        nullable: true
                        example: 2015
                      year_to:
                        type: integer
                        nullable: true
                        example: 2016
                      compare_by:
                        type: string
                        example: "month"
                  trend_direction:
                    type: string
                    enum: [upward, downward, stable]
                    description: Overall trend direction for the period
                    example: upward
                  months:
                    type: array
                    items:
                      type: object
                      properties:
                        year:
                          type: integer
                          example: 2015
                        month:
                          type: integer
                          example: 6
                        month_name:
                          type: string
                          example: "June"
                        trip_count:
                          type: integer
                          description: Total number of trips in this month
                          example: 340909
                        variation_percentage:
                          type: number
                          format: float
                          description: Percentage change from previous month (null for first month)
                          nullable: true
                          example: 3.45
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # UC17 - Demand volatility index por zona (chama Location Service para validar zone_id)
  /demand/zones/{zone_id}/volatility:
    get:
      summary: UC17 - Demand volatility index for a specific zone
      description: >
        Returns the demand volatility index for a given zone, calculated as the
        coefficient of variation of hourly trip counts (standard deviation divided
        by mean). The index is normalized against the city-wide average so that
        a value of 1.0 represents the city average, values above 1.0 indicate
        above-average volatility and values below 1.0 indicate stable demand.
        Also returns the peak hours with anomalously high demand.
        Zone metadata is fetched from the Location Service.
      parameters:
        - name: zone_id
          in: path
          required: true
          description: Unique identifier of the zone to analyse
          schema:
            type: integer
            example: 230
        - name: start_date
          in: query
          required: false
          description: Start of the period (YYYY-MM-DD). If omitted, uses the full dataset.
          schema:
            type: string
            format: date
            example: "2015-01-01"
        - name: end_date
          in: query
          required: false
          description: End of the period (YYYY-MM-DD). If omitted, uses the full dataset.
          schema:
            type: string
            format: date
            example: "2015-12-31"
      responses:
        '200':
          description: Demand volatility index and peak hours for the zone
          content:
            application/json:
              schema:
                type: object
                properties:
                  zone_id:
                    type: integer
                    example: 230
                  zone_name:
                    type: string
                    description: Fetched from Location Service
                    example: "Times Square"
                  borough:
                    type: string
                    description: Fetched from Location Service
                    example: "Manhattan"
                  volatility_index:
                    type: number
                    format: float
                    description: >
                      Normalized coefficient of variation of hourly trip counts.
                      1.0 = city average. Above 1.0 = more volatile than average.
                      Below 1.0 = more stable than average.
                    example: 1.84
                  volatility_classification:
                    type: string
                    enum: [low, medium, high]
                    description: >
                      low = below 0.5x city average,
                      medium = 0.5x to 1.5x city average,
                      high = above 1.5x city average
                    example: "high"
                  city_avg_volatility_index:
                    type: number
                    format: float
                    description: City-wide average volatility index (always 1.0 by definition)
                    example: 1.0
                  peak_hours:
                    type: array
                    description: Hours of the day with anomalously high demand
                    items:
                      type: integer
                    example: [8, 9, 18, 23]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  responses:
    BadRequest:
      description: Invalid query parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Invalid parameter: month must be between 1 and 12"
    NotFound:
      description: Zone not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Zone 999 not found"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "An unexpected error occurred"