openapi: 3.0.3
info:
  title: UrbanPulse – Revenue & Pricing Intelligence API
  description: >
    REST API for historical revenue and pricing analysis of NYC Yellow Taxi trip data.
    Provides pricing intelligence capabilities for urban mobility analytics.
  version: 1.0.0

paths:

  /revenue/avg-fare-by-zone:
    get:
      summary: UC08 – Average fare per zone with deviation from global average
      description: >
        Returns the average fare for all zones, along with the deviation
        (absolute and percentage) from the global average fare.
        Results can be sorted and limited to a top-N list.
      parameters:
        - name: zone_type
          in: query
          required: false
          description: Group by pickup or dropoff zone
          schema:
            type: string
            enum: [pickup, dropoff]
            default: pickup
        - name: year
          in: query
          required: false
          description: Filter by year (e.g. 2015)
          schema:
            type: integer
            example: 2015
        - name: month
          in: query
          required: false
          description: Filter by month (1-12)
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 6
        - name: sort
          in: query
          required: false
          description: Sort zones by average fare
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          required: false
          description: Maximum number of zones to return
          schema:
            type: integer
            default: 20
            maximum: 263
      responses:
        '200':
          description: List of zones with average fare and deviation from global average
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters_applied:
                    type: object
                    properties:
                      zone_type:
                        type: string
                        example: "pickup"
                      year:
                        type: integer
                        nullable: true
                        example: 2015
                      month:
                        type: integer
                        nullable: true
                        example: 6
                      sort:
                        type: string
                        example: "desc"
                      limit:
                        type: integer
                        example: 20
                  global_avg_fare:
                    type: number
                    format: float
                    description: Global average fare across all zones
                    example: 12.45
                  zones:
                    type: array
                    items:
                      type: object
                      properties:
                        zone_id:
                          type: integer
                          example: 161
                        zone_name:
                          type: string
                          example: "Midtown Center"
                        avg_fare:
                          type: number
                          format: float
                          example: 15.30
                        deviation_absolute:
                          type: number
                          format: float
                          description: Difference from global average in USD
                          example: 2.85
                        deviation_percentage:
                          type: number
                          format: float
                          description: Percentage deviation from global average
                          example: 22.89
                        trip_count:
                          type: integer
                          example: 45230
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /revenue/breakdown:
    get:
      summary: UC09 – Percentage breakdown of trip revenue
      description: >
        Returns the average percentage decomposition of the total trip amount
        into its components: base fare, tip, tolls, surcharges and extras.
        By default returns global averages across all trips.
        Can be filtered by zone, zone type, year and month.
      parameters:
        - name: zone_id
          in: query
          required: false
          description: Filter by zone ID (if omitted, returns global average)
          schema:
            type: integer
            example: 161
        - name: zone_type
          in: query
          required: false
          description: Whether zone_id refers to a pickup or dropoff zone
          schema:
            type: string
            enum: [pickup, dropoff]
            default: pickup
        - name: year
          in: query
          required: false
          description: Filter by year (e.g. 2015)
          schema:
            type: integer
            example: 2015
        - name: month
          in: query
          required: false
          description: Filter by month (1-12)
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 6
      responses:
        '200':
          description: Average revenue breakdown with percentage per component
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters_applied:
                    type: object
                    properties:
                      zone_id:
                        type: integer
                        nullable: true
                        example: 161
                      zone_type:
                        type: string
                        example: "pickup"
                      year:
                        type: integer
                        nullable: true
                        example: 2015
                      month:
                        type: integer
                        nullable: true
                        example: 6
                  trip_count:
                    type: integer
                    description: Number of trips used to compute the averages
                    example: 120000
                  avg_total_amount:
                    type: number
                    format: float
                    description: Average total amount paid per trip in USD
                    example: 14.20
                  breakdown:
                    type: object
                    properties:
                      fare_amount:
                        type: object
                        properties:
                          avg:
                            type: number
                            format: float
                            example: 10.50
                          percentage:
                            type: number
                            format: float
                            example: 73.94
                      tip_amount:
                        type: object
                        properties:
                          avg:
                            type: number
                            format: float
                            example: 1.80
                          percentage:
                            type: number
                            format: float
                            example: 12.68
                      tolls_amount:
                        type: object
                        properties:
                          avg:
                            type: number
                            format: float
                            example: 0.40
                          percentage:
                            type: number
                            format: float
                            example: 2.82
                      mta_tax:
                        type: object
                        properties:
                          avg:
                            type: number
                            format: float
                            example: 0.50
                          percentage:
                            type: number
                            format: float
                            example: 3.52
                      improvement_surcharge:
                        type: object
                        properties:
                          avg:
                            type: number
                            format: float
                            example: 0.30
                          percentage:
                            type: number
                            format: float
                            example: 2.11
                      extra:
                        type: object
                        properties:
                          avg:
                            type: number
                            format: float
                            example: 0.70
                          percentage:
                            type: number
                            format: float
                            example: 4.93
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /revenue/fare-per-km:
    get:
      summary: UC10 – Fare per km by zone
      description: >
        Returns the average fare per kilometre for each pickup or dropoff zone,
        calculated from trip distance and fare amount.
        Allows identifying which zones have the highest or lowest pricing efficiency.
      parameters:
        - name: zone_type
          in: query
          required: false
          description: Group by pickup or dropoff zone
          schema:
            type: string
            enum: [pickup, dropoff]
            default: pickup
        - name: year
          in: query
          required: false
          description: Filter by year (e.g. 2015)
          schema:
            type: integer
            example: 2015
        - name: month
          in: query
          required: false
          description: Filter by month (1-12)
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 6
        - name: sort
          in: query
          required: false
          description: Sort results by fare per km
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          required: false
          description: Maximum number of zones to return
          schema:
            type: integer
            default: 20
            maximum: 263
      responses:
        '200':
          description: List of zones with average fare per km
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters_applied:
                    type: object
                    properties:
                      zone_type:
                        type: string
                        example: "pickup"
                      year:
                        type: integer
                        nullable: true
                        example: 2015
                      month:
                        type: integer
                        nullable: true
                        example: 6
                      sort:
                        type: string
                        example: "desc"
                      limit:
                        type: integer
                        example: 20
                  zones:
                    type: array
                    items:
                      type: object
                      properties:
                        zone_id:
                          type: integer
                          example: 161
                        zone_name:
                          type: string
                          example: "Midtown Center"
                        avg_fare_per_km:
                          type: number
                          format: float
                          description: Average fare in USD per kilometre
                          example: 3.45
                        avg_trip_distance_km:
                          type: number
                          format: float
                          description: Average trip distance in kilometres
                          example: 4.20
                        avg_fare:
                          type: number
                          format: float
                          description: Average fare amount in USD
                          example: 14.49
                        trip_count:
                          type: integer
                          description: Number of trips used to compute the averages
                          example: 32100
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  responses:
    BadRequest:
      description: Invalid query parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Invalid parameter: month must be between 1 and 12"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "An unexpected error occurred"
