apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urbanpulse-ingress
  namespace: urbanpulse
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - http:
        paths:
          - path: /payments
            pathType: Prefix
            backend:
              service:
                name: payment-svc
                port:
                  number: 8006