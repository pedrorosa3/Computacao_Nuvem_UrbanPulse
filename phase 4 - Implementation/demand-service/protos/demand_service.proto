syntax = "proto3";

package demand;

service DemandService {
  // Outros serviços enviam o ID da zona e recebem a contagem de viagens por hora
  rpc GetZoneHourlyDemand (ZoneDemandRequest) returns (ZoneDemandResponse);
}

message ZoneDemandRequest {
  int32 zone_id = 1;
}

message ZoneDemandResponse {
  map<int32, int32> hourly_counts = 1; 
}