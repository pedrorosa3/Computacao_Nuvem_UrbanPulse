syntax = "proto3";

package trips;

// A definição do serviço que o Guilherme vai ter de alojar
service TripService {
  // O endpoint gRPC que tu vais chamar
  rpc GetPassengerCounts (PassengerCountRequest) returns (PassengerCountResponse);
}

// O que tu envias (uma lista de IDs de viagens)
message PassengerCountRequest {
  repeated int32 trip_ids = 1;
}

// O que o Guilherme te devolve (um dicionário onde a chave é o ID da viagem e o valor são os passageiros)
message PassengerCountResponse {
  map<int32, int32> trip_passengers = 1;
}