services:
  trip-db:
    image: postgres:16-alpine
    container_name: trip-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: isqueiro20
      POSTGRES_DB: trip_db
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - ./db-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d trip_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s

  trip-api:
    build: .
    container_name: trip-api
    environment:
      DB_HOST: trip-db
      DB_PORT: 5432
      DB_NAME: trip_db
      DB_USER: admin
      DB_PASSWORD: isqueiro20
    ports:
      - "8001:8001" # REST API
      - "50051:50051" # gRPC Server
    depends_on:
      trip-db:
        condition: service_healthy
