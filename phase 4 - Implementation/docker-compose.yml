services:
  location-db:
    image: postgres:16-alpine
    container_name: location-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: isqueiro20
      POSTGRES_DB: location_db
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - location-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U location_user -d location_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  location-db-data:
