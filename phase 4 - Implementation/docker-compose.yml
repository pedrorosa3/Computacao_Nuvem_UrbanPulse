services:
  # ─── PostgreSQL — Location ─────────────────────────────────────────────────
  location-db:
    image: postgres:16-alpine
    container_name: location-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: isqueiro20
      POSTGRES_DB: location_db
    volumes:
      - ./location-service/db:/docker-entrypoint-initdb.d
      - ./location-service/db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d location_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── PostgreSQL — Demand ───────────────────────────────────────────────────
  db-demand:
    image: postgres:16-alpine
    container_name: urbanpulse-db-demand
    environment:
      POSTGRES_DB: demand_db
      POSTGRES_USER: urbanpulse
      POSTGRES_PASSWORD: urbanpulse
    volumes:
      - ./demand-service/db:/docker-entrypoint-initdb.d
      - ./demand-service/db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanpulse -d demand_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── PostgreSQL — Payment ──────────────────────────────────────────────────
  payment-db:
    image: postgres:15-alpine
    container_name: payment_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payment_db
    volumes:
      - ./payment-service/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./payment-service/db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── PostgreSQL — Trip ─────────────────────────────────────────────────────
  trip-db:
    image: postgres:16-alpine
    container_name: trip-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: isqueiro20
      POSTGRES_DB: trip_db
    volumes:
      - ./trip-service/db:/docker-entrypoint-initdb.d
      - ./trip-service/db-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d trip_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ─── Location Service ──────────────────────────────────────────────────────
  location-api:
    build:
      context: ./location-service
    container_name: location-api
    environment:
      DB_HOST: location-db
      DB_PORT: 5432
      DB_NAME: location_db
      DB_USER: admin
      DB_PASSWORD: isqueiro20
      DEMAND_SERVICE_URL: demand-service:50053
    ports:
      - "8000:8000"
      - "50054:50054"
    depends_on:
      location-db:
        condition: service_healthy
      demand-service:
        condition: service_started

  # ─── Demand Service ────────────────────────────────────────────────────────
  demand-service:
    build:
      context: ./demand-service
    container_name: urbanpulse-demand
    environment:
      DATABASE_URL: postgresql://urbanpulse:urbanpulse@db-demand:5432/demand_db
    ports:
      - "8002:8002"
      - "50053:50053"
    depends_on:
      db-demand:
        condition: service_healthy

  # ─── Payment Service ───────────────────────────────────────────────────────
  payment-api:
    build:
      context: ./payment-service
    container_name: payment_fastapi
    environment:
      DATABASE_URL: postgresql://admin:password@payment-db:5432/payment_db
    ports:
      - "8006:8006"
      - "50052:50052"
    depends_on:
      payment-db:
        condition: service_healthy

  # ─── Trip Service ──────────────────────────────────────────────────────────
  trip-api:
    build:
      context: ./trip-service
    container_name: trip-api
    environment:
      DB_HOST: trip-db
      DB_PORT: 5432
      DB_NAME: trip_db
      DB_USER: admin
      DB_PASSWORD: isqueiro20
    ports:
      - "8001:8001"
      - "50051:50051"
    depends_on:
      trip-db:
        condition: service_healthy

  # ─── Analytics Service ─────────────────────────────────────────────────────
  analytics-api:
    build:
      context: ./analytics-service
    container_name: analytics-api
    environment:
      LOCATION_SERVICE_URL: location-api:50054
      DEMAND_SERVICE_URL: demand-service:50053
      PAYMENT_SERVICE_URL: payment-api:50052
    ports:
      - "8003:8003"
    depends_on:
      - location-api
      - demand-service
      - payment-api
      - trip-api
