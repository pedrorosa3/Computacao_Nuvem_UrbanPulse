services:
  # ─── PostgreSQL — Location ─────────────────────────────────────────────────
  location-db:
    image: postgres:16-alpine
    container_name: location-db
    environment:
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: isqueiro20
      POSTGRES_DB:       location_db
    volumes:
      - ./location-service/db:/docker-entrypoint-initdb.d
      - ./location-service/db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d location_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── PostgreSQL — Demand ───────────────────────────────────────────────────
  db-demand:
    image: postgres:16-alpine
    container_name: urbanpulse-db-demand
    environment:
      POSTGRES_DB:       demand_db
      POSTGRES_USER:     urbanpulse
      POSTGRES_PASSWORD: urbanpulse
    volumes:
      - ./demand-service/db:/docker-entrypoint-initdb.d
      - ./demand-service/db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanpulse -d demand_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Location Service ──────────────────────────────────────────────────────
  location-api:
    build:
      context: ./location-service
    container_name: location-api
    environment:
      DB_HOST:             location-db
      DB_PORT:             5432
      DB_NAME:             location_db
      DB_USER:             admin
      DB_PASSWORD:         isqueiro20
      DEMAND_SERVICE_URL:  demand-service:50053
    ports:
      - "8000:8000"    # REST API
      - "50054:50054"  # gRPC
    depends_on:
      location-db:
        condition: service_healthy
      demand-service:
        condition: service_started

  # ─── Demand Service ────────────────────────────────────────────────────────
  demand-service:
    build:
      context: ./demand-service
    container_name: urbanpulse-demand
    environment:
      DATABASE_URL: postgresql://urbanpulse:urbanpulse@db-demand:5432/demand_db
    ports:
      - "8002:8002"    # REST API
      - "50053:50053"  # gRPC
    depends_on:
      db-demand:
        condition: service_healthy
